<<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DIY Cupboards AI</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>DIY Cupboards AI</h1>
      <p class="sub">Ask a question and get a response from your backend.</p>
    </header>

    <main class="chat">
      <div id="messages" class="messages"></div>
    </main>

    <footer class="composer">
      <input id="msg" class="input" placeholder="Type a message…" autocomplete="off" />
      <button id="send" class="btn">Send</button>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
